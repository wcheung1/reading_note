<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>深度閱讀筆記系統 - 重新導向中</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
        Phase 2 終極重構：editor.html 已合併入 index.html 成為 SPA。
        本檔案保留作為：
          1. 相容舊書籤 / 舊連結（避免 404）
          2. 應急 fallback
        所有筆記功能已遷移至 index.html#/shelf 與 index.html#/book/{id}。
    -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            color: #2c3e50;
            text-align: center;
            padding: 60px 20px;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #121212; color: #e0e0e0; }
            a { color: #64b5f6; }
        }
        .box {
            max-width: 460px; margin: 0 auto;
            background: #ffffff; border: 1px solid #bdc3c7;
            border-radius: 12px; padding: 32px;
        }
        @media (prefers-color-scheme: dark) {
            .box { background: #1e1e1e; border-color: #555; }
        }
        .spinner {
            display: inline-block; width: 28px; height: 28px;
            border: 3px solid #bdc3c7; border-top-color: #3498db;
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: #3498db; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h2>🔄 系統已升級至 Phase 2</h2>
        <p>筆記功能已合併至單頁應用程式 (SPA)，正在為您重新導向...</p>
        <p>如果沒有自動跳轉，請<a href="index.html#/shelf">按此手動前往書櫃</a>。</p>
    </div>

    <script>
        // 自動 redirect 至 SPA 書櫃頁
        // （若帶有舊式 #書本資訊，一律導向 shelf；之後由用戶自行選書）
        window.location.replace('index.html#/shelf');
    </script>
</body>
</html>
