<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>我的雲端書櫃 (Master Page)</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --primary: #3498db; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px 40px; text-align: center; }
        .shelf-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        
        .book-btn { background: var(--card); border: 2px solid #333; padding: 30px 20px; border-radius: 10px; cursor: grab; color: var(--text); font-size: 1.1em; transition: transform 0.2s, border-color 0.2s; position: relative; }
        .book-btn:active { cursor: grabbing; }
        .book-btn:hover { border-color: var(--primary); transform: translateY(-5px); }
        .book-btn.dragging { opacity: 0.5; border: 2px dashed var(--primary); }
        
        .controls { background: #1e1e1e; padding: 20px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; text-align: left; max-width: 600px; margin-left: auto; margin-right: auto; }
        input { background: #2a2a2a; color: white; border: 1px solid #444; padding: 10px; margin: 5px 0; border-radius: 5px; width: calc(100% - 22px); box-sizing: border-box; }
        textarea { background: #2a2a2a; color: #a8e6cf; border: 1px solid #444; padding: 10px; margin: 5px 0; border-radius: 5px; width: 100%; box-sizing: border-box; font-family: monospace; font-size: 0.9em; resize: vertical; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1em; margin-top: 5px; width: 100%; box-sizing: border-box; }
        button:hover { opacity: 0.8; }
        
        .delete-btn { position: absolute; top: 5px; right: 5px; background: #e74c3c; color: white; border: none; border-radius: 3px; padding: 2px 5px; font-size: 0.7em; cursor: pointer; display: none; width: auto; }
        .book-btn:hover .delete-btn { display: block; }
        .flex-btns { display: flex; gap: 10px; }
        .flex-btns button { width: auto; flex: 1; }
    </style>
</head>
<body>
    <h1>📚 我的電子書管理書櫃</h1>
    
    <div class="controls">
        <h3 style="margin-top: 0;">📂 第一步：載入書櫃目錄</h3>
        
        <div style="padding-bottom: 15px; border-bottom: 1px solid #333; margin-bottom: 15px;">
            <p style="font-size: 0.85em; color: #888; margin: 0 0 10px 0;">💻 電腦用家：可以直接揀檔案</p>
            <button onclick="loadBookshelfFile()">🖥️ 選擇 JSON 檔案載入</button>
        </div>

        <div>
            <p style="font-size: 0.85em; color: #888; margin: 0 0 10px 0;">📱 手機用家 / 備用方案：請直接貼上 JSON 內容</p>
            <textarea id="json-paste-area" rows="4" placeholder='{"config": {...}, "books": [...]}'></textarea>
            <button onclick="loadPastedJSON()" style="background-color: #27ae60;">📥 載入貼上嘅資料</button>
        </div>
        
        <p id="file-status" style="font-size: 0.8em; color: #888; text-align: center; margin-top: 15px;">尚未載入目錄</p>
    </div>

    <div class="controls" id="add-zone" style="display:none;">
        <h3 style="margin-top: 0;">⚙️ 管理目錄</h3>
        <input type="text" id="new-book-name" placeholder="書名">
        <input type="text" id="new-book-pwd" placeholder="專屬密碼">
        <div class="flex-btns">
            <button onclick="addBookToShelf()">➕ 新增書本</button>
            <button onclick="copyUpdatedJSON()" id="copy-json-btn" style="background-color: #f39c12; display: none;">📋 複製最新 JSON (手動備份)</button>
        </div>
        <p style="font-size: 0.75em; color: #888; margin-top: 10px; line-height: 1.4;">* 提示：如果喺手機版加咗新書或者調咗位，記得撳「複製最新 JSON」，自己 Paste 返去備份檔度呀！</p>
    </div>

    <div class="shelf-container" id="shelf"></div>

<script>
    let bookshelfData = { config: {}, books: [] };
    let fileHandle = null;
    let dragIndex = null;
    let isManualMode = false;

    // 1. 電腦版：載入本地檔案
    async function loadBookshelfFile() {
        try {
            if (!window.showOpenFilePicker) throw new Error("Browser not supported");
            [fileHandle] = await window.showOpenFilePicker({
                types: [{ description: 'JSON Files', accept: {'application/json': ['.json']} }]
            });
            const file = await fileHandle.getFile();
            const contents = await file.text();
            bookshelfData = JSON.parse(contents);
            isManualMode = false;
            
            // 將內容同步落 Text Box 等用家睇到
            document.getElementById('json-paste-area').value = JSON.stringify(bookshelfData, null, 2);
            setupUI("已載入檔案：" + file.name);
        } catch (e) { 
            console.log(e);
            alert("你嘅瀏覽器唔支援直接揀檔案，請將文字 Copy 落下面個 Text Box 度載入！"); 
        }
    }

    // 2. 手機版：載入 Text Box 貼上嘅資料
    function loadPastedJSON() {
        const pasteArea = document.getElementById('json-paste-area');
        if (!pasteArea.value.trim()) return alert("請先貼上資料！");
        
        try {
            bookshelfData = JSON.parse(pasteArea.value);
            isManualMode = true;
            fileHandle = null; // 清除電腦版嘅 File Handle
            setupUI("已載入：手動貼上模式 📱");
        } catch (e) {
            alert("JSON 格式有錯 ❌ 請檢查有冇漏咗括號或者逗號！");
        }
    }

    function setupUI(statusMsg) {
        document.getElementById('add-zone').style.display = 'block';
        document.getElementById('file-status').innerText = statusMsg;
        if (isManualMode) {
            document.getElementById('copy-json-btn').style.display = 'block';
        } else {
            document.getElementById('copy-json-btn').style.display = 'none';
        }
        renderShelf();
    }

    // 3. 儲存/更新 JSON 資料
    async function saveBookshelfFile() {
        // 無論如何，先更新 Text Box 入面嘅字
        document.getElementById('json-paste-area').value = JSON.stringify(bookshelfData, null, 2);
        
        if (!isManualMode && fileHandle) {
            // 如果係電腦版，自動幫佢 Save 埋落個真實 File 度
            try {
                const writable = await fileHandle.createWritable();
                await writable.write(JSON.stringify(bookshelfData, null, 2));
                await writable.close();
            } catch (e) {
                console.error("自動儲存檔案失敗", e);
            }
        }
    }

    // 4. 手動複製最新 JSON (手機專用備份)
    function copyUpdatedJSON() {
        const jsonString = document.getElementById('json-paste-area').value;
        navigator.clipboard.writeText(jsonString).then(() => {
            alert("✅ 最新目錄 JSON 已複製！\n\n請自行將佢 Paste 返去你平時 Keep 住個 Text File / Notes 嗰度做備份。");
        });
    }

    // 5. 渲染書櫃 (Drag & Drop)
    function renderShelf() {
        const shelf = document.getElementById('shelf');
        shelf.innerHTML = '';
        bookshelfData.books.forEach((book, index) => {
            const btn = document.createElement('div');
            btn.className = 'book-btn';
            btn.draggable = true;
            
            const titleSpan = document.createElement('span');
            titleSpan.innerText = book.name;
            titleSpan.onclick = () => openBook(book.pwd);
            btn.appendChild(titleSpan);

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerText = '刪除';
            delBtn.onclick = (e) => { e.stopPropagation(); deleteBookFromShelf(index); };
            btn.appendChild(delBtn);

            // Drag & Drop
            btn.ondragstart = (e) => {
                dragIndex = index;
                e.dataTransfer.effectAllowed = "move";
                setTimeout(() => btn.classList.add('dragging'), 0);
            };
            btn.ondragover = (e) => { e.preventDefault(); };
            btn.ondragenter = (e) => { e.preventDefault(); };
            btn.ondragend = () => { btn.classList.remove('dragging'); };
            btn.ondrop = (e) => {
                e.preventDefault();
                btn.classList.remove('dragging');
                if (dragIndex === null || dragIndex === index) return;
                
                const item = bookshelfData.books.splice(dragIndex, 1)[0];
                bookshelfData.books.splice(index, 0, item);
                
                dragIndex = null;
                saveBookshelfFile(); 
                renderShelf();       
            };

            shelf.appendChild(btn);
        });
    }

    // 6. 打開書本
    function openBook(pwd) {
        const c = bookshelfData.config;
        const url = `editor.html?apiKey=${c.apiKey}&dbURL=${c.databaseURL}&projId=${c.projectId}&pwd=${pwd}`;
        window.location.href = url;
    }

    // 7. 新增書本
    async function addBookToShelf() {
        const name = document.getElementById('new-book-name').value;
        const pwd = document.getElementById('new-book-pwd').value;
        if(!name || !pwd) return alert("請輸入書名同密碼");

        bookshelfData.books.push({ name, pwd });
        await saveBookshelfFile();
        
        document.getElementById('new-book-name').value = '';
        document.getElementById('new-book-pwd').value = '';
        renderShelf();
    }

    // 8. 刪除書本
    async function deleteBookFromShelf(index) {
        if(confirm(`確定要從目錄移除「${bookshelfData.books[index].name}」？`)) {
            bookshelfData.books.splice(index, 1);
            await saveBookshelfFile();
            renderShelf();
        }
    }
</script>
</body>
</html>
