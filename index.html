<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>我的雲端書櫃 (Master Page)</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --primary: #3498db; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 40px; text-align: center; }
        .shelf-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .book-btn { background: var(--card); border: 2px solid #333; padding: 30px 20px; border-radius: 10px; cursor: pointer; color: var(--text); font-size: 1.1em; transition: 0.3s; }
        .book-btn:hover { border-color: var(--primary); transform: translateY(-5px); }
        .controls { background: #1e1e1e; padding: 20px; border-radius: 10px; border: 1px solid #333; margin-bottom: 30px; }
        input { background: #2a2a2a; color: white; border: 1px solid #444; padding: 8px; margin: 5px; border-radius: 5px; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>📚 我的電子書管理書櫃</h1>
    
    <div class="controls">
        <button onclick="loadBookshelfFile()">📂 載入書櫃目錄檔案 (JSON)</button>
        <p id="file-status" style="font-size: 0.8em; color: #888;">尚未載入目錄</p>
    </div>

    <div class="controls" id="add-zone" style="display:none;">
        <h3>➕ 新增書本進目錄</h3>
        <input type="text" id="new-book-name" placeholder="書名">
        <input type="text" id="new-book-pwd" placeholder="專屬密碼">
        <button onclick="addBookToShelf()">新增並儲存</button>
    </div>

    <div class="shelf-container" id="shelf"></div>

<script>
    let bookshelfData = { config: {}, books: [] };
    let fileHandle;

    // 1. 載入本地目錄檔案 (File System Access API)
    async function loadBookshelfFile() {
        try {
            [fileHandle] = await window.showOpenFilePicker({
                types: [{ description: 'JSON Files', accept: {'application/json': ['.json']} }]
            });
            const file = await fileHandle.getFile();
            const contents = await file.text();
            bookshelfData = JSON.parse(contents);
            document.getElementById('add-zone').style.display = 'block';
            document.getElementById('file-status').innerText = "已載入：" + file.name;
            renderShelf();
        } catch (e) { console.log("User cancelled or error"); }
    }

    // 2. 渲染書櫃
    function renderShelf() {
        const shelf = document.getElementById('shelf');
        shelf.innerHTML = '';
        bookshelfData.books.forEach(book => {
            const btn = document.createElement('button');
            btn.className = 'book-btn';
            btn.innerText = book.name;
            btn.onclick = () => openBook(book.pwd);
            shelf.appendChild(btn);
        });
    }

    // 3. 打開書本 (自動帶參數跳轉)
    function openBook(pwd) {
        const c = bookshelfData.config;
        const url = `editor.html?apiKey=${c.apiKey}&dbURL=${c.databaseURL}&projId=${c.projectId}&pwd=${pwd}`;
        window.location.href = url;
    }

    // 4. 新增書本並直接存回本地檔案 (零 LocalStorage)
    async function addBookToShelf() {
        const name = document.getElementById('new-book-name').value;
        const pwd = document.getElementById('new-book-pwd').value;
        if(!name || !pwd) return alert("請輸入書名同密碼");

        bookshelfData.books.push({ name, pwd });
        
        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify(bookshelfData, null, 2));
        await writable.close();
        
        document.getElementById('new-book-name').value = '';
        document.getElementById('new-book-pwd').value = '';
        renderShelf();
    }
</script>
</body>
</html>
